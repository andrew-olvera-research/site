<!DOCTYPE html>

<style>
  :root {
    --bg: #ffffff; --bg-2: #f6f7f9; --ink: #1a1d23; --ink-2: #3b414b; --muted: #6b7280;
    --line: #e3e6ea; --line-2: #cfd4da; --accent: #1f4e8c;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 16.5px; line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  main { width: min(720px, 100% - 32px); margin: 0 auto; padding: 88px 0 56px; }
  h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(36px, 6vw, 48px); line-height: 1.1; letter-spacing: -.01em; }
  .role { margin-top: 8px; font-size: 17px; color: var(--muted); }
  .bio { margin-top: 24px; color: var(--ink-2); max-width: 62ch; }
  .links { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 15px; }
  h2 {
    font-family: var(--serif); font-weight: 600; font-size: 22px;
    margin-top: 56px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .project { display: block; padding: 18px 0; border-bottom: 1px solid var(--line); color: inherit; }
  .project:hover { text-decoration: none; }
  .project .name { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--ink); }
  .project:hover .name { color: var(--accent); }
  .project .meta { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .project .desc { display: block; font-size: 15px; color: var(--ink-2); margin-top: 6px; }
  footer { width: min(720px, 100% - 32px); margin: 0 auto; padding: 0 0 40px; font-size: 13.5px; color: var(--muted); }
</style>
</head>
