<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Physical world-model pretraining</title><desc id="desc">Action-conditioned latent rollouts and physical state-increment losses update a Transformer backbone on closed-loop simulated flight. The backbone initializes the later planner.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#40566a" stroke-width="1.4"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#17746b" stroke-width="1.4"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#253746;font-size:18px}.head{font-size:21px;font-weight:600}.small{font-size:16px;fill:#536576}.label{font-size:17px;fill:#17746b}</style><rect width="100%" height="100%" fill="#fff"/><text x="28" y="35" class="head">01   PHYSICAL REPRESENTATION PRETRAINING</text><rect x="28" y="90" width="240" height="132" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="46" y="122">Closed-loop flight</text><text x="46" y="150">Current physical state</text><text x="46" y="175">Previous command</text><text x="46" y="200">Two ordered gates</text><rect x="332" y="90" width="270" height="132" rx="9" fill="#edf7f5" stroke="#17746b" stroke-width="1.5"/><text class="head" x="350" y="122">Transformer backbone</text><text x="350" y="150">State / action / gate tokens</text><text x="350" y="175">128 wide · 4 heads · 1 layer</text><text x="350" y="200">Updated in pretraining</text><rect x="672" y="90" width="300" height="132" rx="9" fill="#edf7f5" stroke="#17746b" stroke-width="1.5"/><text class="head" x="690" y="122">Action-conditioned model</text><text x="690" y="150">32-tick latent rollouts</text><text x="690" y="175">Physical state-increment</text><text x="690" y="200">reconstruction heads</text><path d="M268 154H332" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M602 154H672" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><rect x="672" y="285" width="300" height="105" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="690" y="317">Physical losses</text><text x="690" y="345">Scaled state increments</text><text x="690" y="370">Orientation + rotor dynamics</text><path d="M822 222V285" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><text x="28" y="278" class="small">Executed actions condition the latent rollout</text><path d="M672 338H467V222" fill="none" stroke="#17746b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/><path d="M972 338H987V205H972" fill="none" stroke="#17746b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/><text x="28" y="338" class="label">Gradient to backbone + model</text><text x="28" y="430" class="small">Only the pretrained observation backbone carries into the planner; rollout and reconstruction heads are training components.</text></svg>