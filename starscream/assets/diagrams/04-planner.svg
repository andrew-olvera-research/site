<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Planner and frozen feedback controller during racing PPO and inference</title><desc id="desc">Current perfect state, previous command and two gate descriptors form ego49. A trained Transformer and MLP projector produce motion64 for a frozen current-state feedback controller. Both refresh at130Hz. PPO updates planner and action exploration, not the controller.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#40566a" stroke-width="1.4"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#17746b" stroke-width="1.4"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#253746;font-size:18px}.head{font-size:21px;font-weight:600}.small{font-size:16px;fill:#536576}.label{font-size:17px;fill:#17746b}</style><rect width="100%" height="100%" fill="#fff"/><text x="28" y="35" class="head">04   RACING PPO AND DEPLOYED INFERENCE</text><rect x="28" y="85" width="248" height="157" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="46" y="117">Current ego49</text><text x="46" y="145">State19 / prev. command4</text><text x="46" y="170">Two gate13 descriptors</text><text x="46" y="195">Five attention tokens</text><text x="46" y="220">No history / settings token</text><rect x="330" y="85" width="294" height="157" rx="9" fill="#edf7f5" stroke="#17746b" stroke-width="1.5"/><text class="head" x="348" y="117">Observation-only planner</text><text x="348" y="145">Pretrained Transformer</text><text x="348" y="170">Learned MLP projector</text><text x="348" y="195">Bounded continuous motion64</text><text x="348" y="220">Updated during racing PPO</text><rect x="690" y="85" width="282" height="157" rx="9" fill="#f2f4f7" stroke="#82909c" stroke-width="1.5"/><text class="head" x="708" y="117">Frozen controller</text><text x="708" y="145">Current ego49 + motion64</text><text x="708" y="170">4 bounded policy commands</text><text x="708" y="195">Collective thrust / body rates</text><text x="708" y="220">Fixed during racing PPO</text><path d="M276 155H330" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M624 155H690" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M152 242V275H834V242" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><text x="373" y="299" class="small">Current-state feedback to controller</text><rect x="690" y="337" width="282" height="98" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="708" y="369">Nominal simulated plant</text><text x="708" y="397">Motor lag + rigid-body flight</text><text x="708" y="422">New state at next tick</text><path d="M834 242V337" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M834 435V480H15V155H28" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><text x="28" y="460" class="small">Planner and controller refresh at 130 Hz. World-model rollout heads and privileged motion encoder are absent at inference.</text><text x="28" y="339" class="label">Racing PPO updates the planner + action exploration.</text><text x="28" y="367" class="small">Shared critic, progress/gate/collision rewards, curriculum,</text><text x="28" y="394" class="small">dynamic course sampling and qualified online variants.</text><text x="28" y="421" class="small">No final-stage JEPA or dynamics auxiliary loss.</text></svg>