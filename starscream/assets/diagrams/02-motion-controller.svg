<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="575" viewBox="0 0 1000 575" role="img" aria-labelledby="title desc"><title id="title">Expert-motion codec and feedback controller</title><desc id="desc">During controller PPO, an encoder compresses privileged expert future motion into a bounded continuous64 code. Only this code and current ego49 feed the feedback controller. PPO tracking rewards train codec and controller.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#40566a" stroke-width="1.4"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#17746b" stroke-width="1.4"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#253746;font-size:18px}.head{font-size:21px;font-weight:600}.small{font-size:16px;fill:#536576}.label{font-size:17px;fill:#17746b}</style><rect width="100%" height="100%" fill="#fff"/><text x="28" y="35" class="head">02   LEARN AN EXECUTABLE MOTION INTERFACE</text><rect x="28" y="82" width="298" height="132" rx="9" fill="#fff5e9" stroke="#b57932" stroke-width="1.5" stroke-dasharray="6 4"/><text class="head" x="46" y="114">Expert future · training</text><text x="46" y="142">8 motion samples over 0.4 s</text><text x="46" y="167">15 features + mask per sample</text><text x="46" y="192">Current ego49 → 177D total</text><rect x="390" y="82" width="270" height="132" rx="9" fill="#edf7f5" stroke="#17746b" stroke-width="1.5"/><text class="head" x="408" y="114">Motion encoder MLP</text><text x="408" y="142">Expert-motion compression</text><text x="408" y="167">Continuous 64D tanh code</text><text x="408" y="192">Updated during codec PPO</text><rect x="390" y="286" width="270" height="130" rx="9" fill="#edf7f5" stroke="#17746b" stroke-width="1.5"/><text class="head" x="408" y="318">Feedback controller</text><text x="408" y="346">Current ego49 + motion64</text><text x="408" y="371">113 → 256 → 256 → 128 → 4</text><text x="408" y="396">Updated during codec PPO</text><rect x="728" y="286" width="244" height="130" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="746" y="318">Simulated plant</text><text x="746" y="346">Collective + body rates</text><text x="746" y="371">Tracking reward</text><text x="746" y="396">Reference-phase resets</text><rect x="28" y="286" width="298" height="105" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="46" y="318">Current observation</text><text x="46" y="346">Perfect state + gate map</text><text x="46" y="371">ego49 at each control tick</text><path d="M326 146H390" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M525 214V286" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M326 339H390" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M660 351H728" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M178 214V242H850V286" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><text x="675" y="237" class="small">Tracking targets only</text><path d="M850 416V469H523V416" fill="none" stroke="#17746b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/><path d="M523 469H353V247H525V214" fill="none" stroke="#17746b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/><text x="390" y="499" class="label">PPO tracking objective updates encoder + controller</text><text x="28" y="548" class="small">Future reference samples never bypass the code into the controller. Encoder and controller are frozen in later stages.</text></svg>