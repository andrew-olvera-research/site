<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="815" viewBox="0 0 1000 815" role="img" aria-labelledby="title desc"><title id="title">JEPA and physically propagated expert-trajectory alignment</title><desc id="desc">JEPA regresses planner code to a stopped target from the frozen privileged encoder. Physical alignment then updates backbone and projector through frozen-controller achieved-state rollouts, initialized only once at an expert state.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#40566a" stroke-width="1.4"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#17746b" stroke-width="1.4"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#253746;font-size:18px}.head{font-size:21px;font-weight:600}.small{font-size:16px;fill:#536576}.label{font-size:17px;fill:#17746b}</style><rect width="100%" height="100%" fill="#fff"/><text x="28" y="35" class="head">03   ALIGN THE OBSERVATION-ONLY PLANNER</text><text x="28" y="76" class="head">A  JEPA-style code alignment</text><rect x="28" y="110" width="246" height="105" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="46" y="142">Current ego49</text><text x="46" y="170">No future trajectory</text><text x="46" y="195">No temporal history</text><rect x="330" y="110" width="294" height="105" rx="9" fill="#edf7f5" stroke="#17746b" stroke-width="1.5"/><text class="head" x="348" y="142">Backbone + MLP projector</text><text x="348" y="170">World-model initialization</text><text x="348" y="195">128 → 256 → 64 · tanh</text><rect x="690" y="110" width="282" height="105" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="708" y="142">Predicted motion64</text><text x="708" y="170">Latent regression objective</text><text x="708" y="195">Matches codec coordinates</text><rect x="330" y="270" width="294" height="105" rx="9" fill="#f2f4f7" stroke="#82909c" stroke-width="1.5"/><text class="head" x="348" y="302">Frozen motion encoder</text><text x="348" y="330">ego49 + expert future</text><text x="348" y="355">Stopped-gradient target</text><rect x="28" y="270" width="246" height="105" rx="9" fill="#fff5e9" stroke="#b57932" stroke-width="1.5" stroke-dasharray="6 4"/><text class="head" x="46" y="302">Expert motion window</text><text x="46" y="330">Training only</text><text x="46" y="355">8 samples over 0.4 s</text><path d="M274 162H330" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M624 162H690" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M274 322H330" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M624 322H832V215" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M970 163H985V245H478V215" fill="none" stroke="#17746b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/><text x="660" y="275" class="small">No gradient into target</text><text x="28" y="414" class="label">Projector-only warmup first; then update the backbone and projector together.</text><text x="28" y="478" class="head">B  Physical expert-trajectory alignment</text><rect x="28" y="516" width="246" height="105" rx="9" fill="#fff5e9" stroke="#b57932" stroke-width="1.5" stroke-dasharray="6 4"/><text class="head" x="46" y="548">Expert initialization</text><text x="46" y="576">Start at expert state</text><text x="46" y="601">Once per training window</text><rect x="330" y="516" width="294" height="105" rx="9" fill="#edf7f5" stroke="#17746b" stroke-width="1.5"/><text class="head" x="348" y="548">Observation-only planner</text><text x="348" y="576">Backbone + projector</text><text x="348" y="601">Updated through rollout</text><rect x="690" y="516" width="282" height="105" rx="9" fill="#f2f4f7" stroke="#82909c" stroke-width="1.5"/><text class="head" x="708" y="548">Frozen controller + plant</text><text x="708" y="576">Roll forward on own states</text><text x="708" y="601">Refresh ego49 every tick</text><path d="M274 568H330" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M624 568H690" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M831 621V662H478V621" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><text x="499" y="687" class="small">Achieved-state feedback</text><rect x="28" y="695" width="360" height="84" rx="9" fill="#fff5e9" stroke="#b57932" stroke-width="1.5" stroke-dasharray="6 4"/><text class="head" x="46" y="727">Expert trajectory targets</text><text x="46" y="755">52-tick physical window</text><rect x="690" y="695" width="282" height="84" rx="9" fill="#f7f9fb" stroke="#c7d1db" stroke-width="1.5"/><text class="head" x="708" y="727">Multistep physical loss</text><text x="708" y="755">State-block errors</text><path d="M388 737H690" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M970 569H985V736H972" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#a)"/><path d="M831 695V621" fill="none" stroke="#17746b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/><path d="M690 766H477V621" fill="none" stroke="#17746b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/><text x="28" y="662" class="label">Gradients through rollout</text><text x="28" y="804" class="small">Reference states are targets after initialization; they do not replace the system’s achieved state at every tick.</text></svg>